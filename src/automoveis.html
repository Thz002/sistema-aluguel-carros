<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Automóveis | Vértice Automóveis</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="navbar"></div>

  <main class="container">
    <div id="alertas"></div>

    <div class="row g-4">
      <section class="col-lg-4">
        <div class="card shadow-sm">
          <div class="card-body">
            <h2 id="tituloForm" class="h5 mb-3">Novo automóvel</h2>
            <form id="formAutomovel" novalidate>
              <input type="hidden" name="id">
              <div class="mb-2">
                <label class="form-label" for="matricula">Matrícula</label>
                <input class="form-control" id="matricula" name="matricula" required>
              </div>
              <div class="row g-2 mb-2">
                <div class="col-6">
                  <label class="form-label" for="placa">Placa</label>
                  <input class="form-control" id="placa" name="placa" required>
                </div>
                <div class="col-6">
                  <label class="form-label" for="ano">Ano</label>
                  <input class="form-control" id="ano" name="ano" type="number" min="1950" required>
                </div>
              </div>
              <div class="row g-2 mb-2">
                <div class="col-6">
                  <label class="form-label" for="marca">Marca</label>
                  <input class="form-control" id="marca" name="marca" required>
                </div>
                <div class="col-6">
                  <label class="form-label" for="modelo">Modelo</label>
                  <input class="form-control" id="modelo" name="modelo" required>
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label" for="proprietario">Proprietário</label>
                <select class="form-select" id="proprietario" name="proprietario"></select>
              </div>
              <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Salvar</button>
                <button type="button" id="btnLimpar" class="btn btn-outline-secondary">Limpar</button>
              </div>
            </form>
          </div>
        </div>
      </section>

      <section class="col-lg-8">
        <div class="card shadow-sm">
          <div class="card-body">
            <h2 class="h5 mb-3">Automóveis cadastrados</h2>
            <div class="table-responsive">
              <table class="table table-hover align-middle">
                <thead>
                  <tr><th>Matrícula</th><th>Placa</th><th>Marca / Modelo</th><th>Ano</th><th>Proprietário</th><th></th></tr>
                </thead>
                <tbody id="tabelaAutomoveis"></tbody>
              </table>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/controllers/AutomovelController.js"></script>
</body>
</html>
