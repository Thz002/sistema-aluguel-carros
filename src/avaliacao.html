<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avaliar pedidos | AlugaCar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="navbar"></div>

  <main class="container">
    <div id="alertas"></div>

    <section class="card shadow-sm mb-4">
      <div class="card-body">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
          <h2 class="h5 mb-0">Pedidos de aluguel</h2>
          <select id="filtroStatus" class="form-select w-auto">
            <option value="">Todos os status</option>
            <option value="PENDENTE">Pendentes</option>
            <option value="APROVADO">Aprovados</option>
            <option value="REPROVADO">Reprovados</option>
            <option value="CANCELADO">Cancelados</option>
            <option value="CONTRATADO">Contratados</option>
          </select>
        </div>
        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead>
              <tr><th>#</th><th>Cliente</th><th>Automóvel</th><th>Período</th><th>Status</th><th></th></tr>
            </thead>
            <tbody id="tabelaPedidos"></tbody>
          </table>
        </div>
      </div>
    </section>

    <section class="card shadow-sm mb-4">
      <div class="card-body">
        <h2 class="h5 mb-3">Contratos executados</h2>
        <div class="table-responsive">
          <table class="table align-middle">
            <thead>
              <tr><th>#</th><th>Pedido</th><th>Tipo</th><th>Proprietário do automóvel</th><th>Crédito</th><th>Data</th></tr>
            </thead>
            <tbody id="tabelaContratos"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <!-- Modal: modificar pedido -->
  <div class="modal fade" id="modalEditar" tabindex="-1">
    <div class="modal-dialog">
      <form id="formEditar" class="modal-content" novalidate>
        <div class="modal-header">
          <h3 class="modal-title h5">Modificar pedido</h3>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="alertasEditar" class="alertas-modal"></div>
          <input type="hidden" name="id">
          <div class="mb-2">
            <label class="form-label" for="editAutomovel">Automóvel</label>
            <select class="form-select" id="editAutomovel" name="automovelId"></select>
          </div>
          <div class="row g-2">
            <div class="col-6">
              <label class="form-label" for="editInicio">Início</label>
              <input class="form-control" id="editInicio" name="dataInicio" type="date">
            </div>
            <div class="col-6">
              <label class="form-label" for="editFim">Fim</label>
              <input class="form-control" id="editFim" name="dataFim" type="date">
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Fechar</button>
          <button type="submit" class="btn btn-primary">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: avaliação financeira -->
  <div class="modal fade" id="modalAvaliar" tabindex="-1">
    <div class="modal-dialog">
      <form id="formAvaliar" class="modal-content" novalidate>
        <div class="modal-header">
          <h3 class="modal-title h5">Análise financeira</h3>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="alertasAvaliar" class="alertas-modal"></div>
          <input type="hidden" name="id">
          <div id="resumoAvaliacao" class="mb-3"></div>
          <label class="form-label" for="parecer">Parecer</label>
          <textarea class="form-control" id="parecer" name="parecer" rows="3"></textarea>
        </div>
        <div class="modal-footer">
          <button type="submit" value="reprovar" class="btn btn-outline-danger"><i class="bi bi-hand-thumbs-down"></i> Reprovar</button>
          <button type="submit" value="aprovar" class="btn btn-success"><i class="bi bi-hand-thumbs-up"></i> Aprovar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: execução do contrato -->
  <div class="modal fade" id="modalContrato" tabindex="-1">
    <div class="modal-dialog">
      <form id="formContrato" class="modal-content" novalidate>
        <div class="modal-header">
          <h3 class="modal-title h5">Executar contrato</h3>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="alertasContrato" class="alertas-modal"></div>
          <input type="hidden" name="pedidoId">
          <div class="mb-2">
            <label class="form-label" for="tipoContrato">Tipo de contrato</label>
            <select class="form-select" id="tipoContrato" name="tipo">
              <option value="SIMPLES">Simples</option>
              <option value="CREDITO">Com contrato de crédito</option>
            </select>
          </div>
          <div class="mb-2">
            <label class="form-label" for="proprietarioContrato">Automóvel registrado como propriedade de</label>
            <select class="form-select" id="proprietarioContrato" name="proprietario"></select>
          </div>
          <div id="camposCredito" class="border rounded p-2 d-none">
            <div class="mb-2">
              <label class="form-label" for="bancoId">Banco concedente</label>
              <select class="form-select" id="bancoId" name="bancoId"></select>
            </div>
            <div class="row g-2">
              <div class="col-7">
                <label class="form-label" for="valor">Valor do crédito (R$)</label>
                <input class="form-control" id="valor" name="valor" type="number" min="0" step="0.01">
              </div>
              <div class="col-5">
                <label class="form-label" for="parcelas">Parcelas</label>
                <input class="form-control" id="parcelas" name="parcelas" type="number" min="1" value="12">
              </div>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Fechar</button>
          <button type="submit" class="btn btn-success">Executar contrato</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/controllers/AvaliacaoController.js"></script>
</body>
</html>
